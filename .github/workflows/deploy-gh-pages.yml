name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository variable (Settings → Secrets and variables → Actions → Variables): Dev in WebWasm, Prod in the prod copy.
      # Not set = Dev. It selects the API address (appsettings.Prod.json) and the icon set (Environments/Prod).
      APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT || 'Dev' }}
    steps:
      - name: Check APP_ENVIRONMENT
        run: |
          case "$APP_ENVIRONMENT" in
            Dev|Prod) echo "Environment: $APP_ENVIRONMENT" ;;
            *) echo "APP_ENVIRONMENT must be Dev or Prod, got '$APP_ENVIRONMENT'"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Test
        run: dotnet test --project WebWasm.Tests/WebWasm.Tests.csproj

      - name: Publish
        run: dotnet publish WebWasm/WebWasm.csproj -c Release -o publish -p:WasmApplicationEnvironmentName=$APP_ENVIRONMENT

      # The site lives at /<repository name>/, the same code works for any repository name.
      - name: Update base href
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|g' publish/wwwroot/index.html

      - name: Fix Blazor WASM File Hashes
        uses: StefH/ghaction-BlazorWebAssemblyFileHashFixer@v1
        with:
          wwwroot-path: publish/wwwroot

      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
